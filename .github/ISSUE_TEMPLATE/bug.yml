name: Bug report
description: Something in the CRM did not work (anyone can file one)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, in plain words
      description: What did you click, what did you expect, and what happened instead? A screenshot helps.
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Which screen
      placeholder: "Contacts, Campaigns > New, Linked numbers ..."
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: Where it happened
      options: [My own machine (dev), A deployed copy (prod), Not sure]
    validations: { required: true }
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The time it happened (we can find it in the logs), the number or contact involved, whether it happens every time.
  - type: markdown
    attributes:
      value: |
        **For whoever picks this up:** run `npm run bug -- "<title>" --found "<who, where>"` to give it an R-number and a test stub, write the failing test, fix it, then mark it `guarded` in `tests/regression/REGISTRY.md` (see `tests/regression/README.md`).
