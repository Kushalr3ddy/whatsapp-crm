# Runs on every push and pull request. The previous system had no test or lint CI at all —
# its only two workflows were a deploy and a backup, neither of which validated anything
# (docs/00-prior-art.md, M21).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Integration tests run against a real Postgres, never a mock — the boundary is exactly where
      # mocks lie (docs/12-testing.md). User `dev` on 5434 so the vitest default connection string
      # (dev:dev@localhost:5434/whatsapp_crm_test) works with no extra env, and `dev` is a superuser
      # so migration 0001 can create the `crm_app` role the RLS tests drop into.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: whatsapp_crm_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # An S3-compatible server for the StorageDriver contract suite (tests/contract/s3-storage.test.ts).
      # moto is an S3 emulator; MinIO's own images are no longer pulled from Docker Hub or Quay.
      s3:
        image: motoserver/moto:latest
        ports: ['19000:5000']

    # The migration runner validates the app's config at boot (required secrets are a hard crash, never
    # a silent fallback), so the job needs real-shaped throwaway values even though no test uses them.
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/whatsapp_crm_test
      NODE_ENV: test
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789abcdef  # gitleaks:allow
      PUBLIC_URL: http://localhost:3000
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff  # gitleaks:allow
      ENCRYPTION_INDEX_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100  # gitleaks:allow
      API_KEY: ci-only-bootstrap-api-key-0123456789abcdef  # gitleaks:allow
      # Points the S3 contract suite at the emulator above; without it that suite skips.
      S3_TEST_ENDPOINT: http://localhost:19000
      S3_TEST_ACCESS_KEY_ID: test  # gitleaks:allow
      S3_TEST_SECRET_ACCESS_KEY: test  # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Typecheck before lint: a type error usually explains any lint noise downstream.
      - name: typecheck
        run: npm run typecheck
      # apps/web is excluded from the root tsconfig (it needs DOM/JSX/React types), so it is
      # checked separately or a UI type error passes CI unnoticed.
      - name: typecheck web
        run: npm run typecheck:web
      # Includes the comment rule and the layering rule, both architectural (docs/11-conventions.md).
      - name: lint
        run: npm run lint

      # Migrate the test database BEFORE the tests — this builds the schema and creates the crm_app
      # role + grants (migration 0001). Without it every integration test hits "relation does not
      # exist".
      - name: migrate test database
        run: npm run db:migrate:test
      - name: test
        run: npm test
      # A migration that only works once is not a migration. Re-running must be a no-op.
      - name: migrations are idempotent
        run: npm run db:migrate:test

  # The anti-ban simulation is its own workflow now (.github/workflows/simulation.yml): it takes
  # several minutes and has its own trigger rules, so it neither slows this job nor hides in it.

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: whatsapp_crm_dev
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The app validates its config at boot, so the e2e run needs real-shaped (throwaway) secrets.
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/whatsapp_crm_dev
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789abcdef  # gitleaks:allow
      PUBLIC_URL: http://localhost:3000
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff  # gitleaks:allow
      ENCRYPTION_INDEX_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100  # gitleaks:allow
      API_KEY: ci-only-bootstrap-api-key-0123456789abcdef  # gitleaks:allow
      SEND_TYPING_SIMULATION: 'false'
      NODE_ENV: development
      # The gateway runs the in-memory fake channel, so a broadcast can be verified end to end with
      # nothing real sent. The day/night behaviours are off so the run does not depend on the clock,
      # and sweeps are fast so a campaign finishes in seconds.
      GATEWAY_CHANNEL: fake
      GATEWAY_SWEEP_SECONDS: '3'
      SEND_CIRCADIAN: 'false'
      SEND_RECIPIENT_TIMEZONE: 'false'
      SEND_BACKGROUND_ENTROPY: 'false'
      # The Playwright specs sign in with these (see playwright.config.ts).
      TEST_EMAIL: e2e@test.local
      TEST_PASSWORD: E2eTest!pass99
      # Reuse the stack this job starts rather than letting Playwright run `npm run dev:all`.
      E2E_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: migrate dev database
        run: npm run db:migrate
      - name: provision the e2e admin
        run: >-
          npm run admin -- org --name "E2E Test Org" --slug e2e-test
          --email "$TEST_EMAIL" --password "$TEST_PASSWORD"

      - name: seed the test org
        run: npm run local:seed

      # Start the API, gateway and web, wait until the API and web answer, then run the browser specs. Playwright reuses
      # this already-running stack (reuseExistingServer), so its own webServer command never fires.
      - name: start API and web
        run: |
          npm run dev > /tmp/api.log 2>&1 &
          npm run gateway > /tmp/gateway.log 2>&1 &
          npm run web > /tmp/web.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:3000/ready >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3001/login >/dev/null; do sleep 2; done'
      - name: e2e
        run: npm run test:e2e

      # The page snapshot, trace and screenshot of every failed browser test, so a failure can be looked at, not guessed at.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7

      - name: server logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/gateway.log /tmp/web.log || true

  # The same browser tests, but on a PRODUCTION build of the web app, for the bugs that only exist there (R-001: forms hanging on "Creating…"
  # because Next's own gzip never finished a redirecting response). Only the @smoke set and the speed probe, so it stays short.
  regress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: whatsapp_crm_dev
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/whatsapp_crm_dev
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789abcdef  # gitleaks:allow
      PUBLIC_URL: http://localhost:3000
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff  # gitleaks:allow
      ENCRYPTION_INDEX_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100  # gitleaks:allow
      API_KEY: ci-only-bootstrap-api-key-0123456789abcdef  # gitleaks:allow
      SEND_TYPING_SIMULATION: 'false'
      NODE_ENV: development
      GATEWAY_CHANNEL: fake
      GATEWAY_SWEEP_SECONDS: '3'
      SEND_CIRCADIAN: 'false'
      SEND_RECIPIENT_TIMEZONE: 'false'
      SEND_BACKGROUND_ENTROPY: 'false'
      TEST_EMAIL: e2e@test.local
      TEST_PASSWORD: E2eTest!pass99
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: migrate, provision the e2e admin, seed
        run: |
          npm run db:migrate
          npm run admin -- org --name "E2E Test Org" --slug e2e-test --email "$TEST_EMAIL" --password "$TEST_PASSWORD"
          npm run local:seed
      - name: start API and gateway
        run: |
          npm run dev > /tmp/api.log 2>&1 &
          npm run gateway > /tmp/gateway.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://localhost:3000/ready >/dev/null; do sleep 2; done'
      - name: regression (registry, production build, smoke tests, speed probe)
        run: npm run regress:ci
      - name: the report
        if: always()
        run: cat regression-report.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            regression-report.md
            test-results/regress/
      - name: server logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/gateway.log test-results/regress/web.log || true

  secrets-scan:
    runs-on: ubuntu-latest
    # On a pull request gitleaks lists the PR's commits through the API; the default token cannot,
    # which failed the job with "Resource not accessible by integration" before it scanned anything.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The previous repo committed a real-looking candidate record with name, mobile, DOB,
      # street address and salary (docs/00-prior-art.md, M19).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
