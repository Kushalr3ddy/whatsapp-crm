# The anti-ban simulation, as its own check.
#
# Days of simulated traffic run through the real engine against a virtual WhatsApp that bans when it
# is misbehaved with — and, since the silent-restriction tracker, one that quietly stops delivering
# (docs/12-testing.md). A ban, or a restriction that goes unnoticed, is a build failure.
#
# Separate from ci.yml on purpose: it takes minutes, so it runs on its own clock, shows up as its own
# line on a pull request, and can be re-run alone. It runs when the engine (or its tests) change, on
# every push to main, and on demand.
name: simulation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/channels/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'apps/gateway/**'
      - 'tests/simulation/**'
      - 'vitest.sim.config.ts'
      - '.github/workflows/simulation.yml'
  workflow_dispatch:

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: whatsapp_crm_test
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway, real-shaped values: the migration runner validates config at boot.
    env:
      DATABASE_URL: postgresql://dev:dev@localhost:5434/whatsapp_crm_test
      NODE_ENV: test
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789abcdef  # gitleaks:allow
      PUBLIC_URL: http://localhost:3000
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff  # gitleaks:allow
      ENCRYPTION_INDEX_KEY: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100  # gitleaks:allow
      API_KEY: ci-only-bootstrap-api-key-0123456789abcdef  # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrate test database
        run: npm run db:migrate:test
      - name: anti-ban simulation
        run: npm run test:sim
