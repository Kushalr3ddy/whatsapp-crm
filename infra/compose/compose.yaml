# The alpha stack: one app container (API + gateway + web) and Postgres.
#
#   cp infra/compose/alpha.env.example infra/compose/.env     # then fill the secrets
#   docker compose -f infra/compose/compose.yaml up -d --build
#
# Ports on the host (change the left-hand side in .env if one is taken):
#   3000  API          3001  web UI          5434  Postgres (the dev database also uses 5434)
name: whatsapp-crm

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-whatsapp_crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: whatsapp-crm:alpha
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CRM_API_URL: http://127.0.0.1:3000
      STORAGE_PATH: /app/storage
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatsapp_crm}
    volumes:
      - storage:/app/storage
    ports:
      - "${API_HOST_PORT:-3000}:3000"
      - "${WEB_HOST_PORT:-3001}:3001"

volumes:
  pgdata:
  storage:
