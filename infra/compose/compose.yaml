# The alpha stack: one app container (API + gateway + web) and Postgres.
#
#   npm run alpha:up        (or: docker compose -p whatsapp-crm -f infra/compose/compose.yaml up -d --build)
#
# That is the whole setup. On first start the app generates its secrets, migrates the database
# and creates a first admin; the sign-in details are in `docker compose logs app`. Anything in
# infra/compose/.env (see alpha.env.example) overrides the defaults.
#
# Ports on the host (change the left-hand side in .env if one is taken):
#   3000  API          3001  web UI          5434  Postgres (the dev database also uses 5434)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: the default password is not a secret, so it is not offered to the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-whatsapp_crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: whatsapp-crm:alpha
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CRM_API_URL: http://127.0.0.1:3000
      # Local disk by default. Set STORAGE_DRIVER=s3 (or minio) and the S3_* values in infra/compose/.env to
      # use a bucket instead; files already on the volume are not copied across.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
      STORAGE_PATH: /app/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@db:5432/${POSTGRES_DB:-whatsapp_crm}
      # Blank means "generate once and keep"; set a value in infra/compose/.env to supply your own.
      APP_SECRET: ${APP_SECRET:-}
      API_KEY: ${API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_INDEX_KEY: ${ENCRYPTION_INDEX_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ORG_NAME: ${ORG_NAME:-My Organisation}
      ORG_SLUG: ${ORG_SLUG:-my-org}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      # Optional line shown across the top of every page, e.g. "Test environment: expect bugs, note them".
      ENVIRONMENT_BANNER: ${ENVIRONMENT_BANNER:-}
      SEND_TIMEZONE: ${SEND_TIMEZONE:-Asia/Kolkata}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-IN}
    volumes:
      - storage:/app/storage
      - state:/app/state
    ports:
      - "${API_HOST_PORT:-3000}:3000"
      - "${WEB_HOST_PORT:-3001}:3001"

  # Optional: publishes the web UI through a Cloudflare Tunnel (docs/30-cloudflare-tunnel.md).
  # Off by default; `npm run alpha:tunnel` turns it on. Create the tunnel in the Cloudflare
  # dashboard, add a public hostname pointing at http://app:3001, and put its token in
  # infra/compose/.env as TUNNEL_TOKEN. Only the web port is routed: the API stays private.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      # auto tries QUIC (UDP 7844) then falls back; set http2 if UDP is dropped on this network.
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_PROTOCOL:-auto}
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  state:
