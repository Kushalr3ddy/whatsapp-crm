            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/conversations"
        name: no credential → 401
        meta:
          id: req_5e93c4026a114e35880045f5ba28b5d7
          created: 0
          modified: 0
          isPrivate: false
          description: Identical body to a WRONG credential. Distinguishing them confirms
