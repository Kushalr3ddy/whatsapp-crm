          sortKey: 1
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/conversations/not-a-uuid/messages"
        name: check body.status matches the status line
        meta:
          id: req_74745ec854384624aeef673caa9f91bd
          created: 0
          modified: 0
          isPrivate: false
          description: 'Two routers used to hardcode "status": 0 in the body while the
            real code went out on the status line. body.status must equal the
            HTTP status on every route.'
          sortKey: 5
        method: GET
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/conversations/not-a-uuid/messages"
        name: malformed id → 422, not 500
        meta:
          id: req_e00dbaf1408e4ff7af26b85cde4257db
          created: 0
          modified: 0
          isPrivate: false
          description: "Used to be a 500: the value reached Postgres, the uuid cast raised
            22P02, and a caller's typo surfaced as INTERNAL_ERROR."
          sortKey: 3
        method: GET
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
