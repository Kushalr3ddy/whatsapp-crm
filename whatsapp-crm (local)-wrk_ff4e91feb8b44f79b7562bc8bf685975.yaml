      - url: "{{ _.base_url }}/admin/keys"
        name: mint an org key (bootstrap)
        meta:
          id: req_710662ba2de946028f4e52c969830061
          created: 0
          modified: 0
          isPrivate: false
          description: >-
            The secret is returned ONCE. Paste it into the org_key environment
            variable.


            rateLimitPerMin is optional; omit for the default of 120, 0 for
            unlimited.
          sortKey: 1
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "orgId": "{{ _.org_id }}",
              "name": "insomnia",
              "scopes": [
                "conversations:read",
                "messages:send",
                "senders:read",
                "senders:write"
              ],
              "rateLimitPerMin": 120
            }
        headers:
          - name: Authorization
            value: Bearer {{ _.bootstrap_key }}
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/auth/login"
        name: sign in (session + CSRF cookies)
        meta:
          id: req_c362b5842a7344d98cac3aa133bbb801
          created: 0
          modified: 0
          isPrivate: false
          description: Cookie auth. Non-GET requests afterwards must echo the crm_csrf
            cookie in an x-csrf-token header — that is the double-submit check.
          sortKey: 3
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "you@example.com",
              "password": "..."
            }
        headers:
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: 5 · Send pacing (P6) — READ THIS FIRST
    meta:
      id: fld_8a94712b67734f8d82b69e8999aea075
      created: 0
      modified: 0
      sortKey: -50
      description: >-
        These queue REAL messages. With the gateway running and a number linked
        they will be SENT to whoever test_recipient names. Use a number you
        control.


        The gate is in the gateway, not the API, so the API always answers 202.
        What pacing changes is WHEN the gateway drains the queue — and whether
        it drains it at all.
    children:
      - url: "{{ _.base_url }}/messages"
        name: queue one message → 202
        meta:
          id: req_1b7150ffe48b4cc9a58b485ed20cb0bf
          created: 0
          modified: 1790515920246
          isPrivate: false
          description: >-
            202 means ACCEPTED, not sent. The gateway decides when it actually
            goes.


            Then poll the thread: status goes queued → sent → delivered → read.
          sortKey: 1
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": "{{ _.test_recipient }}",
              "body": "hello from whatsapp-crm"
            }
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/conversations/{{ _.conversation_id }}/messages"
        name: poll the thread to watch statuses move
        meta:
          id: req_5648be4f1ffe40639ed1f6a021ccdc55
          created: 0
          modified: 0
          isPrivate: false
          description: There is currently NO API that says why a message is still queued —
            paced and 'sender disconnected' look identical from here. Only the
            gateway log distinguishes them. That gap is recorded in HANDOFF.md.
          sortKey: 4
        method: GET
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/messages"
        name: queue a burst, then watch it drain slowly
        meta:
          id: req_5a2356dbb7ff477392b3b885494697d6
          created: 0
          modified: 0
          isPrivate: false
          description: >-
            Send this 10+ times quickly, then poll the thread.


            WITHOUT pacing every one would go at machine speed — which is how a
            number is lost permanently.


            WITH pacing you should see:
              · a 1.5-4s gap between each send (Gaussian, not a fixed interval)
              · no more than SEND_RATE_PER_MINUTE (default 8) in any minute
              · the rest sitting at status 'queued' — NOT failed

            A paced message is left queued on purpose: early is not wrong, and
            failing it would lose it. Watch the gateway log for 'send paced'.
          sortKey: 3
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "to": "{{ _.test_recipient }}",
              "body": "burst test"
            }
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/messages"
        name: reply into an existing thread → 202
        meta:
          id: req_8f97e76f857c48868d4e213656576f36
          created: 0
          modified: 0
          isPrivate: false
          description: For a contact with no phone number — a WhatsApp privacy address
            (@lid) has none, and `to` could never name them.
          sortKey: 2
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "conversationId": "{{ _.conversation_id }}",
              "body": "reply"
            }
        headers:
          - name: Authorization
            value: Bearer {{ _.org_key }}
          - name: Content-Type
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
